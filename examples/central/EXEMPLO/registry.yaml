# docs/EXEMPLO/registry.yaml (repositório central)
#
# Cenário: projeto "EXEMPLO" (checkout), demonstrando os três caminhos que
# o sizing (seção 19) abre — `large` com ADR, `medium` sem ADR, e `small`
# indo direto para a SDD sem nenhum documento no repositório central.
# As SDDs deste projeto NÃO aparecem aqui — vivem no repositório de
# projeto (ver ../../project-repo-checkout/docs/sdd/registry.yaml).
# Ver regras completas em _framework/rules/workflow-rules.yaml

project: "EXEMPLO"
framework_version: "2.0.0"
# Registry de demonstração: as entradas representam o cenário, mas os .md
# não fazem parte do kit (ver README, "Exemplos incluídos").
demo: true
repository: "https://github.com/org/exemplo-checkout"

documents:
  # --- Caso A: sizing `large` — o gate exige ADR ---
  - id: STRAT-EXEMPLO-0001
    type: STRAT
    title: "Reduzir tempo de checkout em 30%"
    status: approved
    owner: "time-produto"
    created: "2026-08-01"
    updated: "2026-08-01"
    relates_to: [RFC-EXEMPLO-0001]
    path: "docs/EXEMPLO/00-strategy/STRAT-EXEMPLO-0001.md"

  - id: RFC-EXEMPLO-0001
    type: RFC
    title: "Migrar processamento de pagamento para novo provedor"
    status: approved
    owner: "time-checkout"
    created: "2026-08-02"
    updated: "2026-08-05"
    relates_to: [STRAT-EXEMPLO-0001, ADR-EXEMPLO-0001]
    requires_adr: true
    decision_gate_criteria_met: [troca_tecnologia_vendor, alto_custo_reversao, impacto_cross_team]
    path: "docs/EXEMPLO/01-rfc/RFC-EXEMPLO-0001.md"

  - id: ADR-EXEMPLO-0001
    type: ADR
    title: "Adotar Provedor X para processamento de pagamento"
    status: approved
    owner: "arquitetura"
    created: "2026-08-06"
    updated: "2026-08-06"
    relates_to: [RFC-EXEMPLO-0001, SPEC-EXEMPLO-0001]
    parent_rfc: RFC-EXEMPLO-0001
    strategic_impact: false
    provenance: authored
    path: "docs/EXEMPLO/02-adr/ADR-EXEMPLO-0001.md"

  # Uma SPEC só: requisito (Parte 1) e desenho (Parte 2) no mesmo arquivo.
  # Até a v1.7.0 isto eram dois documentos, PRD e Tech Spec, com o mesmo
  # autor, o mesmo parent e revisão conjunta.
  - id: SPEC-EXEMPLO-0001
    type: SPEC
    title: "Novo fluxo de checkout com Provedor X"
    status: approved
    owner: "time-checkout"
    created: "2026-08-07"
    updated: "2026-08-07"
    relates_to: [RFC-EXEMPLO-0001, ADR-EXEMPLO-0001, SDD-EXEMPLO-0001]
    parent_rfc: RFC-EXEMPLO-0001
    parent_adr: ADR-EXEMPLO-0001
    sizing: large
    path: "docs/EXEMPLO/03-spec/SPEC-EXEMPLO-0001.md"

  # --- Caso B: sizing `medium` — RFC aprovada, gate dispensa ADR ---
  - id: RFC-EXEMPLO-0002
    type: RFC
    title: "Adicionar campo opcional de apelido no formulário de endereço"
    status: approved
    owner: "time-checkout"
    created: "2026-08-10"
    updated: "2026-08-11"
    relates_to: [SPEC-EXEMPLO-0002]
    requires_adr: false
    decision_gate_criteria_met: []
    path: "docs/EXEMPLO/01-rfc/RFC-EXEMPLO-0002.md"

  - id: SPEC-EXEMPLO-0002
    type: SPEC
    title: "Campo opcional de apelido no endereço de entrega"
    status: approved
    owner: "time-produto"
    created: "2026-08-11"
    updated: "2026-08-11"
    relates_to: [RFC-EXEMPLO-0002, SDD-EXEMPLO-0002]
    parent_rfc: RFC-EXEMPLO-0002
    parent_adr: null
    sizing: medium
    path: "docs/EXEMPLO/03-spec/SPEC-EXEMPLO-0002.md"

  # --- Caso C: sizing `small` ---
  # Correção de uma máscara de CEP: toca 2 arquivos, nenhum critério do
  # gate RFC->ADR se aplica, comportamento externo do produto não muda.
  #
  # Este caso NÃO tem entrada aqui, de propósito. Em `small` não existe
  # RFC, ADR nem SPEC — só a SDD, no repositório do projeto
  # (SDD-EXEMPLO-0003), e o vínculo com o código é o `Refs:` no commit.
  # A ausência do documento É o registro de que a fase foi pulada; não se
  # cria documento para declarar que outro não era necessário.
