# nascendo de um action item estrutural do postmortem).

project: "LEGADO"
framework_version: "1.7.0"
# Registry de demonstração: as entradas representam o cenário, mas os .md
# não fazem parte do kit (ver README, "Exemplos incluídos").
demo: true
repository: "https://github.com/org/legado"

documents:
