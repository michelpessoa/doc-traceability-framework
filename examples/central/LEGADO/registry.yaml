    owner: "time-legado"
    created: "2026-08-09"
    updated: "2026-08-09"
    relates_to: [ADR-LEGADO-0001]
    scan_date: "2026-08-09"
    tags: [onboarding]
    path: "docs/LEGADO/06-baseline/BASE-LEGADO-0001.md"

  - id: ADR-LEGADO-0001
    type: ADR
    title: "Uso de fila única para processamento assíncrono (reconstruído)"
    status: approved
