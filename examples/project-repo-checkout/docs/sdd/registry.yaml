    type: SDD
    title: "Spec Driven Design — checkout com Provedor X"
    status: approved
    owner: "time-checkout"
    created: "2026-08-08"
    updated: "2026-08-08"
    relates_to: [PRD-EXEMPLO-0001, TS-EXEMPLO-0001, ADR-EXEMPLO-0001]
    source_docs:
      - id: PRD-EXEMPLO-0001
        url: "https://github.com/org/framework-central/blob/main/docs/EXEMPLO/03-prd/PRD-EXEMPLO-0001.md"
      - id: TS-EXEMPLO-0001
        url: "https://github.com/org/framework-central/blob/main/docs/EXEMPLO/04-tech-spec/TS-EXEMPLO-0001.md"
      - id: ADR-EXEMPLO-0001
        url: "https://github.com/org/framework-central/blob/main/docs/EXEMPLO/02-adr/ADR-EXEMPLO-0001.md"
    ai_targets: [claude-code, cursor]
    path: "docs/sdd/SDD-EXEMPLO-0001.md"

