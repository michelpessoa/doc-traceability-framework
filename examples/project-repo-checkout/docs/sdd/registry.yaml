# docs/sdd/registry.yaml (repositório do PROJETO "checkout")
#
# Só SDDs deste projeto. source_docs referencia PRD/TS/ADR que vivem no
# repositório central "framework-central" — por isso cada entrada carrega
# id + url (sem a url a rastreabilidade quebraria ao atravessar repositórios).

project: "EXEMPLO"
framework_version: "1.7.0"
# Registry de demonstração: as entradas representam o cenário, mas os .md
# não fazem parte do kit (ver README, "Exemplos incluídos").
demo: true

documents:
