# Manifesto escrito à mão do INDEX.md do kit (SDD-DTF-0043, RF02).
# Ordem importa: a primeira entrada que casa vence. `render_indexes.py`
# reprova arquivo do kit sem entrada e entrada sem arquivo. Glob relativo
# a _framework/; `*` não atravessa "/", `**` atravessa.
entries:
  - path: "AGENTS.md"
    what: "Instruções do agente para o próprio kit"
    when: "Ao editar arquivos dentro de _framework/"
  - path: "procedures/*.md"
    what: "Procedimento passo a passo de uma skill"
    when: "Ao executar handover, pickup ou verify-sdd"
  - path: "prompts/copilot/*"
    what: "Renderização do núcleo para o Copilot"
    when: "Ao configurar o Copilot no repositório"
  - path: "prompts/cursor/*"
    what: "Renderização do núcleo para o Cursor"
    when: "Ao configurar o Cursor no repositório"
  - path: "prompts/universal.md"
    what: "Prompt universal gerado, colável em qualquer IA"
    when: "Ao usar uma IA sem AGENTS.md nem skill"
  - path: "prompts/*.md"
    what: "Prompt de fluxo específico (audit, onboarding)"
    when: "Ao auditar commits ou onboardar projeto legado"
  - path: "rules/workflow-rules.yaml"
    what: "Fonte canônica das regras do framework"
    when: "Ao mudar ou consultar regra; leia pelo mapa"
  - path: "rules/workflow-rules.map.md"
    what: "Mapa gerado de seções do YAML (ids, linhas)"
    when: "Antes de ler o YAML: achar a seção certa"
  - path: "rules/kit-index.yaml"
    what: "Manifesto escrito à mão deste INDEX.md"
    when: "Ao criar ou remover arquivo do kit"
  - path: "scripts/tests/*"
    what: "Teste ou fixture dos scripts do kit"
    when: "Ao alterar o script correspondente"
  - path: "scripts/guard_bash.sh"
    what: "Hook que barra comando Bash proibido"
    when: "Ao depurar bloqueio de comando"
  - path: "scripts/render_prompts.py"
    what: "Gerador dos adaptadores a partir do YAML"
    when: "Ao regenerar AGENTS.md, prompts e cópias"
  - path: "scripts/render_indexes.py"
    what: "Gerador de índices, mapa e sumários"
    when: "Ao regenerar INDEX.md, mapa e sumários"
  - path: "scripts/framework_lib.py"
    what: "Biblioteca compartilhada dos scripts"
    when: "Ao criar ou alterar um script do kit"
  - path: "scripts/validate_*.py"
    what: "Validador de documento ou de estado"
    when: "Ao depurar reprovação de validação"
  - path: "scripts/hook_*.py"
    what: "Hook de sessão ou pós-edição do Claude Code"
    when: "Ao depurar um hook"
  - path: "scripts/check_*.py"
    what: "Checagem de commit, hooks, cópias ou origem"
    when: "Ao depurar a checagem correspondente"
  - path: "scripts/*.py"
    what: "Script utilitário ou gerador do kit"
    when: "Ao rodar ou depurar o script"
  - path: "skills/*/SKILL.md"
    what: "Definição de skill do Claude Code"
    when: "Ao ajustar comportamento ou gatilho da skill"
  - path: "skills/doc-traceability-framework/scripts/*"
    what: "Cópia byte a byte de scripts/ (gerada)"
    when: "Nunca à mão; regenere com render_prompts.py"
  - path: "skills/doc-traceability-framework/templates/*"
    what: "Cópia de templates/ dentro da skill"
    when: "Nunca à mão; espelha templates/"
  - path: "skills/doc-traceability-framework/prompts/*"
    what: "Cópia de prompts/ dentro da skill"
    when: "Nunca à mão; espelha prompts/"
  - path: "skills/doc-traceability-framework/references/*"
    what: "Cópia do workflow-rules.yaml na skill (gerada)"
    when: "Nunca à mão; regenere com render_prompts.py"
  - path: "templates/ci/*"
    what: "Exemplo de workflow de CI"
    when: "Ao adotar o gate de verificação de SDD no CI"
  - path: "templates/*.template.md"
    what: "Template de um tipo de documento"
    when: "Ao criar um documento desse tipo"
  - path: "tests/fixtures/*"
    what: "Fixture de teste do kit"
    when: "Ao alterar o teste que a usa"
  - path: "tests/*.py"
    what: "Teste do kit (paridade, gates, render)"
    when: "Ao mudar o comportamento testado"
