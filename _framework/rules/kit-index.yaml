# Manifesto escrito à mão do INDEX.md do kit (SDD-DTF-0043, RF02; SDD-DTF-0049).
# Ordem importa: a primeira entrada que casa vence. `render_indexes.py`
# reprova arquivo do kit sem entrada e entrada sem arquivo. Glob relativo
# a _framework/; `*` não atravessa "/", `**` atravessa. `what` e `when`
# aceitam {name} (arquivo com extensão) e {stem} (sem extensão).
# `map_summaries` dá o resumo de seção do mapa quando o YAML não tem fonte.
entries:
  - path: "AGENTS.md"
    what: "Regras do agente dentro de _framework/: espelho com o kit público e YAML como fonte"
    when: "Ao editar qualquer arquivo dentro de _framework/"
  - path: "procedures/handover.md"
    what: "Procedimento normativo do handover: como gerar o HANDOFF.md de uma sessão"
    when: "Ao gerar um HANDOFF.md ou mudar a skill handover"
  - path: "procedures/pickup.md"
    what: "Procedimento normativo do pickup: retomar trabalho a partir do HANDOFF.md"
    when: "Ao retomar de um handoff ou mudar a skill pickup"
  - path: "procedures/verify-sdd.md"
    what: "Procedimento da verificação independente de SDD antes de implemented"
    when: "Ao verificar uma SDD ou mudar a skill verify-sdd"
  - path: "prompts/copilot/copilot-instructions.md"
    what: "Renderização do núcleo do framework para o GitHub Copilot"
    when: "Ao configurar o Copilot num repositório de projeto"
  - path: "prompts/cursor/doc-framework.mdc"
    what: "Regra do Cursor com o núcleo do framework, sempre ativa"
    when: "Ao configurar o Cursor num repositório de projeto"
  - path: "prompts/framework-audit.md"
    what: "Prompt da auditoria periódica de commits e PRs contra o registry"
    when: "Ao auditar a aderência de um projeto ao framework"
  - path: "prompts/onboarding-bootstrap.md"
    what: "Prompt do bootstrap de projeto legado: BASE e ADRs reconstruídos"
    when: "Ao onboardar um projeto com código sem documentos"
  - path: "prompts/universal.md"
    what: "Prompt universal gerado do YAML, colável em qualquer IA, com sumário"
    when: "Ao usar o framework numa IA sem AGENTS.md nem skill"
  - path: "rules/kit-index.yaml"
    what: "Manifesto manual deste INDEX.md e dos resumos de seção do mapa"
    when: "Ao criar, mover ou remover arquivo do kit"
  - path: "rules/workflow-rules.map.md"
    what: "Mapa gerado das seções do YAML: id, título, chaves, linhas, bytes e resumo"
    when: "Antes de ler o YAML, para achar a seção certa"
  - path: "rules/workflow-rules.yaml"
    what: "Fonte canônica das regras: gates, sizing, tipos, ciclo de status e changelog"
    when: "Ao mudar ou consultar uma regra; leia pelo mapa"
  - path: "scripts/check_commit.py"
    what: "Checa mensagem de commit: Conventional Commits e referência a id do framework"
    when: "Ao depurar hook commit-msg ou checagem de intervalo"
  - path: "scripts/check_hooks.py"
    what: "Reprova .claude/settings.json com hook mudo ou mal configurado"
    when: "Ao editar hooks do Claude Code"
  - path: "scripts/check_renderings.py"
    what: "Compara os fatos entre YAML, SKILL.md, universal, Cursor e Copilot"
    when: "Ao mudar uma renderização e ver divergência"
  - path: "scripts/check_source_docs.py"
    what: "Confere que cada source_docs da SDD existe, usável e no arquivo certo"
    when: "Ao depurar falha de fidelidade à origem da SDD"
  - path: "scripts/ci_gate_verify_sdd.py"
    what: "Gate de CI que barra SDD implemented sem validação PASS real"
    when: "Ao adotar ou depurar o gate de CI do verify-sdd"
  - path: "scripts/framework_check.py"
    what: "Entrada única dos validadores: registry, conteúdo e estado das SDDs"
    when: "Ao rodar a validação completa ou configurar o pre-commit"
  - path: "scripts/framework_lib.py"
    what: "Base comum dos validadores: front-matter, constantes do YAML e caminhos"
    when: "Ao criar ou alterar um script do kit"
  - path: "scripts/generate_registry_md.py"
    what: "Gera registry.md a partir do registry.yaml, sem hora, com --check"
    when: "Ao regenerar ou conferir o registry.md"
  - path: "scripts/guard_bash.sh"
    what: "Hook PreToolUse que recusa comando Bash destrutivo antes de rodar"
    when: "Ao depurar bloqueio de comando pelo agente"
  - path: "scripts/hook_post_edit.py"
    what: "Hook PostToolUse que valida o documento recém-editado"
    when: "Ao depurar aviso de gate após editar documento"
  - path: "scripts/hook_session_start.py"
    what: "Hook SessionStart que injeta instrução de pickup no contexto"
    when: "Ao depurar o que a sessão recebe ao começar"
  - path: "scripts/lessons_check.py"
    what: "Conta a recorrência do critério de 2 projetos nas lições locais"
    when: "Ao decidir se uma lição vira candidata a promoção"
  - path: "scripts/parallel_plan.py"
    what: "Cruza arquivos tocados das tasks e diz quais rodam em paralelo"
    when: "Ao planejar a ordem das tasks de uma SDD"
  - path: "scripts/registry_tools.py"
    what: "CLI do registry: validate, trace por id e audit de commits"
    when: "Ao validar o registry ou rastrear um documento"
  - path: "scripts/render_indexes.py"
    what: "Gera INDEX.md do kit, mapa de seções do YAML, INDEX de SDDs e sumários"
    when: "Ao mudar a forma ou o teto de um índice gerado"
  - path: "scripts/render_prompts.py"
    what: "Gera AGENTS.md, prompts e cópias da skill a partir do YAML"
    when: "Ao regenerar os arquivos derivados do YAML"
  - path: "scripts/selftest.py"
    what: "Muta os validadores do kit e exige que os testes falhem"
    when: "Ao checar se os testes dos validadores discriminam"
  - path: "scripts/validate_doc.py"
    what: "Validador do gate de qualidade de conteúdo: placeholders e seções"
    when: "Ao depurar reprovação de conteúdo de documento"
  - path: "scripts/validate_state.py"
    what: "Validador do gate de escopo: SDD implemented exige evidência real"
    when: "Ao depurar reprovação de evidência de uma SDD"
  - path: "scripts/tests/mutations.yaml"
    what: "Lista de mutações dos validadores usada pelo selftest.py"
    when: "Ao adicionar mutação ou depurar mutante sobrevivente"
  - path: "scripts/tests/test_check_commit.py"
    what: "Testes do check_commit.py sobre repositório git temporário"
    when: "Ao alterar a checagem de mensagem de commit"
  - path: "scripts/tests/test_check_hooks.py"
    what: "Testes do check_hooks.py: um caso por regra de hook"
    when: "Ao alterar a checagem de hooks"
  - path: "scripts/tests/test_check_source_docs.py"
    what: "Testes do check_source_docs.py sobre origens da SDD"
    when: "Ao alterar a checagem de source_docs"
  - path: "scripts/tests/test_discover.py"
    what: "Testes da descoberta de diretórios em framework_check.discover"
    when: "Ao alterar como o framework_check acha os documentos"
  - path: "scripts/tests/test_generate_registry_md.py"
    what: "Testes do cabeçalho, da ausência de hora e do --check do registry.md"
    when: "Ao alterar o generate_registry_md.py"
  - path: "scripts/tests/test_guard_bash.py"
    what: "Testes do guard_bash.sh: exit 0 libera, exit 2 bloqueia"
    when: "Ao alterar o hook de bloqueio de comandos"
  - path: "scripts/tests/test_hook_post_edit.py"
    what: "Testes do hook_post_edit.py sobre documentos mínimos"
    when: "Ao alterar o hook pós-edição"
  - path: "scripts/tests/test_hook_session_start.py"
    what: "Testes do hook_session_start.py com repositório mínimo"
    when: "Ao alterar o hook de início de sessão"
  - path: "scripts/tests/test_lessons_check.py"
    what: "Testes do lessons_check.py: contagem de recorrência de lições"
    when: "Ao alterar a contagem de lições"
  - path: "scripts/tests/test_operational_artifacts.py"
    what: "Testes dos artefatos operacionais por glob, como validation-*.md"
    when: "Ao alterar quais arquivos dispensam front-matter"
  - path: "scripts/tests/test_render_prompts_mechanization.py"
    what: "Testes do bloco mechanization gerado pelo render_prompts.py"
    when: "Ao alterar a mecanização dos gates nas renderizações"
  - path: "scripts/tests/test_render_prompts_sync.py"
    what: "Testes do sync de templates e da cópia byte a byte da skill"
    when: "Ao alterar sync_copies ou a paridade do bundle"
  - path: "scripts/tests/test_selftest.py"
    what: "Testes do selftest.py: mutante morto, sobrevivente e não aplicável"
    when: "Ao alterar a mutação dos validadores"
  - path: "scripts/tests/test_table_cells.py"
    what: "Testes do split_table_row para células de tabela markdown"
    when: "Ao alterar a leitura de células de tabela"
  - path: "scripts/tests/test_validate_state.py"
    what: "Testes do validate_state.py sobre o YAML real"
    when: "Ao alterar o gate de evidência da SDD"
  - path: "skills/doc-traceability-framework/SKILL.md"
    what: "Skill principal: roteador do fluxo de documentos, sizing e gates"
    when: "Ao ajustar gatilho ou roteamento da skill principal"
  - path: "skills/doc-traceability-framework/references/audit.md"
    what: "Referência da skill sobre auditoria de commits e PRs contra o registry"
    when: "Ao pedir auditoria e a skill carregar a referência"
  - path: "skills/doc-traceability-framework/references/incidents.md"
    what: "Referência da skill sobre incidente, severidade e postmortem"
    when: "Ao abrir incidente ou postmortem pela skill"
  - path: "skills/doc-traceability-framework/references/onboarding.md"
    what: "Referência da skill sobre onboarding de projeto já existente"
    when: "Ao onboardar projeto legado pela skill"
  - path: "skills/doc-traceability-framework/references/*"
    what: "Cópia gerada de rules/{name} dentro da skill"
    when: "Nunca à mão; regenere com render_prompts.py"
  - path: "skills/doc-traceability-framework/scripts/*"
    what: "Cópia gerada de scripts/{name} dentro da skill"
    when: "Nunca à mão; regenere com render_prompts.py"
  - path: "skills/doc-traceability-framework/templates/*"
    what: "Cópia gerada de templates/{name} dentro da skill"
    when: "Nunca à mão; regenere com render_prompts.py"
  - path: "skills/doc-traceability-framework/prompts/*"
    what: "Cópia gerada de prompts/{name} dentro da skill"
    when: "Nunca à mão; regenere com render_prompts.py"
  - path: "skills/handover/SKILL.md"
    what: "Skill handover: gatilho e ponte para procedures/handover.md"
    when: "Ao ajustar quando a skill handover dispara"
  - path: "skills/pickup/SKILL.md"
    what: "Skill pickup: gatilho e ponte para procedures/pickup.md"
    when: "Ao ajustar quando a skill pickup dispara"
  - path: "skills/verify-sdd/SKILL.md"
    what: "Skill verify-sdd: gatilho e ponte para procedures/verify-sdd.md"
    when: "Ao ajustar quando a skill verify-sdd dispara"
  - path: "templates/adr.template.md"
    what: "Template de ADR: decisão, alternativas e consequências"
    when: "Ao criar um ADR"
  - path: "templates/base.template.md"
    what: "Template de BASE: baseline do estado atual de projeto legado"
    when: "Ao fazer o onboarding de projeto legado"
  - path: "templates/ci/verify-sdd-gate.yml.example"
    what: "Exemplo de workflow do GitHub Actions para o gate verify-sdd"
    when: "Ao adotar o gate de CI num repositório de projeto"
  - path: "templates/inc.template.md"
    what: "Template de INC: incidente com severidade e causa raiz"
    when: "Ao abrir um incidente"
  - path: "templates/pm.template.md"
    what: "Template de PM: postmortem de um incidente com action items"
    when: "Ao escrever um postmortem"
  - path: "templates/prd.template.md"
    what: "Template legado de PRD, mantido para projetos sob 1.x"
    when: "Ao ler PRD antigo; não usar em trabalho novo"
  - path: "templates/rfc.template.md"
    what: "Template de RFC: proposta, gate para ADR e sizing"
    when: "Ao criar uma RFC"
  - path: "templates/sdd.template.md"
    what: "Template de SDD: compilada da SPEC, com tasks e critérios de aceite"
    when: "Ao compilar uma SDD"
  - path: "templates/spec.template.md"
    what: "Template de SPEC: requisitos em EARS, contratos e estratégia de teste"
    when: "Ao criar uma SPEC"
  - path: "templates/strategy.template.md"
    what: "Template de STRAT: direção estratégica opcional"
    when: "Ao criar um Strategy Doc"
  - path: "templates/tech-spec.template.md"
    what: "Template legado de Tech Spec, mantido para projetos sob 1.x"
    when: "Ao ler TS antigo; não usar em trabalho novo"
  - path: "tests/fixtures/sdd_fixture_a.md"
    what: "SDD fictícia A que os testes do parallel_plan.py leem"
    when: "Ao alterar test_parallel_plan.py"
  - path: "tests/fixtures/sdd_fixture_b.md"
    what: "SDD fictícia B que os testes do parallel_plan.py leem"
    when: "Ao alterar test_parallel_plan.py"
  - path: "tests/fixtures/verify_sdd_pre_reorder.md"
    what: "Cópia do verify-sdd antes da reordenação, base do teste de estrutura"
    when: "Ao alterar test_procedures_structure.py"
  - path: "tests/test_ci_gate_verify_sdd.py"
    what: "Testes do ci_gate_verify_sdd.py: bloqueio de merge sem validação PASS"
    when: "Ao alterar o gate de CI do verify-sdd"
  - path: "tests/test_gate_texto.py"
    what: "Regressão do texto do gate de implementação antes do código"
    when: "Ao editar o texto de gate_implementation_before_code"
  - path: "tests/test_gitattributes_generated.py"
    what: "Testes do .gitattributes que marca o bundle gerado"
    when: "Ao alterar o .gitattributes dos arquivos gerados"
  - path: "tests/test_kit_parity.py"
    what: "Paridade byte a byte entre scripts originais e cópias da skill"
    when: "Ao alterar um script copiado para a skill"
  - path: "tests/test_parallel_plan.py"
    what: "Testes do parallel_plan.py sobre SDDs fictícias"
    when: "Ao alterar o cálculo de paralelismo das tasks"
  - path: "tests/test_procedures_structure.py"
    what: "Testes da estrutura do procedimento verify-sdd.md"
    when: "Ao reordenar ou editar o verify-sdd.md"
  - path: "tests/test_render_indexes.py"
    what: "Testes do render_indexes.py: mapa, INDEX do kit, SDDs, tetos e idempotência"
    when: "Ao alterar qualquer índice gerado"
  - path: "tests/test_repo_hygiene.py"
    what: "Testes de higiene: caches fora da busca e do versionamento"
    when: "Ao alterar .gitignore ou .claudeignore"
  - path: "tests/test_skill_md_consistency.py"
    what: "Testes de consistência entre SKILL.md e workflow-rules.yaml"
    when: "Ao alterar o SKILL.md ou a tabela de sizing"
  - path: "tests/test_template_parity.py"
    what: "Paridade byte a byte dos templates entre original e bundle"
    when: "Ao alterar um template"
  - path: "tests/test_validate_doc.py"
    what: "Testes do validate_doc.py: placeholders, seções e front-matter"
    when: "Ao alterar o gate de qualidade de conteúdo"
map_summaries:
  "2": "Os oito tipos de documento: STRAT, RFC, ADR, SPEC, SDD, BASE, INC e PM, com pasta e repositório"
  "6": "Estados do ciclo de vida de status, transições permitidas e notas de uso"
  "7": "Padrão do id de documento: tipo, código do projeto e sequência de 4 dígitos"
  "9": "Registry central e de projeto: campos das entradas, regra de atualização e consulta de rastreio"
  "12": "Lista das 18 capacidades que a IA deve ter, de criar documento a escrever handover"
